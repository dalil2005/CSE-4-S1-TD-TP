<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" rx="14" fill="#1e1e1e"/>
  <!-- title bar -->
  <rect width="900" height="34" rx="14" fill="#323233"/>
  <rect y="20" width="900" height="14" fill="#323233"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" font-size="13" fill="#cccccc" text-anchor="middle">Visual Studio Code</text>
  <!-- activity bar -->
  <rect x="0" y="34" width="56" height="426" fill="#333333"/>
  <rect x="16" y="56" width="24" height="24" rx="3" fill="none" stroke="#858585" stroke-width="2"/>
  <rect x="16" y="104" width="24" height="24" rx="3" fill="none" stroke="#858585" stroke-width="2"/>
  <rect x="16" y="152" width="24" height="24" rx="3" fill="none" stroke="#858585" stroke-width="2"/>
  <!-- extensions icon highlighted -->
  <rect x="0" y="198" width="3" height="40" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="14" y="212" width="11" height="11"/><rect x="27" y="212" width="11" height="11"/>
    <rect x="14" y="225" width="11" height="11"/><rect x="29" y="199" width="11" height="11" transform="rotate(0)"/>
  </g>
  <!-- sidebar -->
  <rect x="56" y="34" width="330" height="426" fill="#252526"/>
  <text x="76" y="64" font-size="12" fill="#bbbbbb" letter-spacing="1">EXTENSIONS</text>
  <!-- search box -->
  <rect x="72" y="80" width="298" height="30" rx="3" fill="#3c3c3c" stroke="#007acc" stroke-width="1.5"/>
  <text x="84" y="100" font-size="14" fill="#e0e0e0">vscode-pdf</text>
  <!-- result -->
  <rect x="56" y="124" width="330" height="86" fill="#37373d"/>
  <rect x="72" y="138" width="56" height="56" rx="6" fill="#ef4444"/>
  <text x="100" y="174" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
  <text x="142" y="154" font-size="15" font-weight="700" fill="#ffffff">vscode-pdf</text>
  <text x="142" y="173" font-size="12" fill="#a0a0a0">Display pdf in VSCode.</text>
  <text x="142" y="192" font-size="12" fill="#a0a0a0">tomoki1207</text>
  <rect x="296" y="178" width="76" height="22" rx="3" fill="#0e639c"/>
  <text x="334" y="194" font-size="12" fill="#fff" text-anchor="middle">Install</text>
  <!-- editor area -->
  <text x="640" y="230" font-size="26" fill="#5a5a5a" text-anchor="middle">Open any PDF here</text>
  <rect x="540" y="250" width="200" height="6" rx="3" fill="#333"/>
  <!-- step badges -->
  <g font-weight="700" font-size="18" text-anchor="middle" fill="#fff">
    <circle cx="28" cy="218" r="0" />
    <circle cx="90" cy="218" r="15" fill="#f43f5e"/><text x="90" y="224">1</text>
    <circle cx="395" cy="95" r="15" fill="#f43f5e"/><text x="395" y="101">2</text>
    <circle cx="385" cy="189" r="15" fill="#f43f5e"/><text x="385" y="195">3</text>
  </g>
  <!-- legend -->
  <rect x="76" y="260" width="296" height="170" rx="10" fill="#1e1e1e" stroke="#3c3c3c"/>
  <g font-size="14" fill="#d4d4d4">
    <circle cx="98" cy="288" r="10" fill="#f43f5e"/><text x="98" y="293" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="118" y="293">Click the Extensions icon</text>
    <circle cx="98" cy="326" r="10" fill="#f43f5e"/><text x="98" y="331" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="118" y="331">Search  vscode-pdf</text>
    <circle cx="98" cy="364" r="10" fill="#f43f5e"/><text x="98" y="369" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="118" y="369">Click Install</text>
    <text x="98" y="406" fill="#4ade80" font-weight="700">Done: PDFs open inside VS Code</text>
  </g>
</svg>
