<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introduction to Parallel Computing — PopBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1d1a;--paper:#f4efe3;--accent:#b8342a;--blue:#2f5fd0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfc8bb;font-family:"Newsreader",Georgia,serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pageWrap{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2}
#leftPage{position:absolute;left:0;top:0;width:600px;height:860px;transform-origin:0 0;pointer-events:auto;padding:34px 40px 28px 44px;mix-blend-mode:multiply;transition:opacity .35s;will-change:transform}
/* formulas are usually LTR math even inside an RTL page */
#leftPage .eq,#leftPage .formula small{unicode-bidi:plaintext}
#leftPage[dir=rtl]{font-family:"Noto Naskh Arabic","Newsreader",serif}
#leftPage .inner{transform-origin:0 0}
#leftPage[dir=rtl] .inner{transform-origin:100% 0}
#leftPage.hidden{opacity:0;pointer-events:none}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.hd>div:first-child{flex:1}
.kicker{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#6b6358}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:44px;line-height:1.0;margin:8px 0 12px}
[dir=rtl] h1{font-family:"Noto Naskh Arabic",serif;font-size:36px;line-height:1.3}
.concept{font-size:17px;line-height:1.38;margin:0 0 12px}
.formula{border:1.4px solid var(--ink);padding:10px 13px;font-size:16px;margin:4px 0 14px;position:relative}
.formula b.lab{position:absolute;top:-9px;inset-inline-start:10px;background:var(--paper);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;padding:0 5px;font-weight:600}
.formula .eq{font-family:"Instrument Serif",serif;font-size:24px;line-height:1.15}
[dir=rtl] .formula .eq{font-family:"Noto Naskh Arabic",serif;font-size:20px}
.formula small{display:block;font-size:13.5px;color:#5c554b;margin-top:2px}
h4{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 5px;font-weight:600}
dl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14.8px;line-height:1.28}
dt{font-weight:600;white-space:nowrap}
dd{margin:0;color:#3d3830}
.controls{margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.rng{display:flex;align-items:center;gap:8px}
.btn{font:600 12px "JetBrains Mono",monospace;letter-spacing:.03em;border:1.4px solid var(--ink);background:transparent;color:var(--ink);padding:6px 10px;cursor:pointer;border-radius:2px}
.btn:hover{background:rgba(31,29,26,.08)}
.btn.on{background:var(--ink);color:var(--paper)}
input[type=range]{accent-color:var(--ink);width:170px}
.readout{font-family:"JetBrains Mono",monospace;font-size:12px}
.quiz{margin:0 0 12px}
.quiz p{margin:0 0 7px;font-size:15.8px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{all:unset;cursor:pointer;font-size:15px;padding:6px 9px;padding-inline-start:30px;border:1.2px solid rgba(31,29,26,.55);position:relative;line-height:1.25}
.opt::before{content:attr(data-k);position:absolute;inset-inline-start:8px;top:6px;font:600 11.5px "JetBrains Mono",monospace}
.opt:hover{background:rgba(31,29,26,.06)}
.opt.right{border-color:#2d7a3e;background:rgba(45,122,62,.13)}
.opt.wrong{border-color:var(--accent);background:rgba(184,52,42,.1);text-decoration:line-through}
.opt[disabled]{pointer-events:none}
.flapZone{position:relative;min-height:96px}
.under{border:1.2px dashed rgba(31,29,26,.5);padding:10px 13px;font-size:14.8px;line-height:1.33}
.under b{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;display:block;margin-bottom:3px}
.flap{position:absolute;inset:0;background:#efe7d5;border:1.3px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-family:"Instrument Serif",serif;font-size:21px;cursor:pointer;transform-origin:50% 0;transition:transform .7s cubic-bezier(.5,.1,.3,1),opacity .7s;box-shadow:0 3px 0 rgba(31,29,26,.18)}
.flap small{font-family:"JetBrains Mono",monospace;font-size:10.5px;display:block;color:#6b6358}
.flap.locked{cursor:not-allowed;color:#7a7266}
.flap.open{transform:perspective(600px) rotateX(-86deg);opacity:0;pointer-events:none}
.stamp{flex:none;margin-top:6px;width:92px;height:92px;border-radius:50%;border:1.6px dashed rgba(31,29,26,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 9.5px "JetBrains Mono",monospace;letter-spacing:.06em;color:#7a7266;text-align:center;line-height:1.3;transition:all .4s}
.stamp.inked{border:3px double var(--accent);color:var(--accent);transform:rotate(-12deg) scale(1.04);font-size:15px}
.stamp.inked span{font-size:9px}
.folio{position:absolute;bottom:22px;inset-inline-start:44px;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:#7a7266}
.plan{margin:0 0 16px;padding-inline-start:20px;font-size:15.5px;line-height:1.36}
#tip{position:fixed;z-index:5;pointer-events:none;background:#fbf8f1;border:1.3px solid var(--ink);padding:6px 9px;font-size:13px;max-width:260px;line-height:1.3;box-shadow:3px 3px 0 rgba(31,29,26,.2);opacity:0;transition:opacity .15s}
#tip b{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;display:block;text-transform:uppercase}
#bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px;background:rgba(251,248,241,.92);border:1.3px solid var(--ink);border-radius:30px;padding:6px 8px;box-shadow:0 6px 20px rgba(40,30,20,.18);backdrop-filter:blur(4px)}
#bar button{all:unset;cursor:pointer;font:600 12px "JetBrains Mono",monospace;padding:7px 12px;border-radius:20px}
#bar button:hover{background:rgba(31,29,26,.08)}
#bar button:disabled{opacity:.35;pointer-events:none}
#bar .play{background:var(--ink);color:var(--paper)}
#bar .play:hover{background:#3a3631}
#ttl{font-family:"Instrument Serif",serif;font-size:17px;padding:0 8px;min-width:210px;text-align:center;white-space:nowrap}
#dots{display:flex;gap:5px;padding:0 6px}
#dots i{width:8px;height:8px;border-radius:50%;border:1.2px solid var(--ink);display:block;cursor:pointer}
#dots i.cur{background:var(--ink)}
#dots i.done{border-color:var(--accent);background:var(--accent)}
#head{position:fixed;left:18px;top:14px;z-index:3;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#4a443b}
#head b{font-family:"Instrument Serif",serif;font-size:19px;letter-spacing:0;text-transform:none;display:block;color:var(--ink);font-weight:400}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:#cfc8bb;font-family:"Instrument Serif",serif;font-size:26px;transition:opacity .6s}
#loading .err{font-family:"JetBrains Mono",monospace;font-size:13px;background:#fbf8f1;border:1.3px solid var(--ink);padding:18px 22px;max-width:760px}
#loading .err pre{white-space:pre-wrap;color:var(--accent)}
body.narrow #c{position:fixed;height:52vh}
body.narrow #pageWrap{position:fixed;top:52vh;bottom:0;left:0;width:100%;height:auto;overflow-y:auto;pointer-events:auto;background:var(--paper);border-top:1.3px solid var(--ink)}
body.narrow #leftPage{position:relative;transform:none!important;width:100%;max-width:600px;height:auto;margin:0 auto;padding:22px 20px 100px;mix-blend-mode:normal}
body.narrow .stamp{width:76px;height:76px}
body.narrow h1{font-size:32px}
body.narrow #head,body.narrow #dots{display:none}
body.narrow #ttl{min-width:0;font-size:15px}
body.narrow .folio{position:static;margin-top:14px}
body.narrow #bar{bottom:10px;width:calc(100% - 20px);justify-content:space-between}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="head"></div>
<div id="pageWrap"><div id="leftPage" class="hidden"></div></div>
<div id="tip"></div>
<div id="bar">
  <button id="prev" aria-label="Previous">←</button>
  <div id="ttl"></div>
  <div id="dots"></div>
  <button id="demo" class="play">▶ Demo</button>
  <button id="next" aria-label="Next">→</button>
</div>
<div id="loading">Opening the book…</div>

const book = {"title":"Introduction to Parallel Computing","subtitle":"High Performance Computing · 4th-year Computer Science Engineers (AI) · 8 May 1945 University, Guelma · Dr. Rochdi Boudjehem · 2025/2026","lang":"en","dir":"ltr","coverColor":"#1b6a8a","spreads":[{"kind":"cover","short":"Cover & plan","slides":"Slides 1–2","title":"Introduction to Parallel Computing","concept":"Chapter 1 of High Performance Computing for Computer Science Engineers. Six parts: motivation, performance basics, fundamental laws, parallel and distributed systems, programming models, conclusion.","plan":["Apply Amdahl's and Gustafson's laws to analyze performance","Classify parallel architectures with Flynn's taxonomy","Differentiate shared-memory, distributed and accelerated systems","Identify programming models for each parallel architecture"],"fig":"Fig. 1 — Touch the hub and the four nodes: they are the four goals of this chapter.","scene":{"type":"network","hub":{"label":"Parallel computing","tip":"Many operations at the same time to solve bigger problems faster."},"nodes":[{"label":"Laws","tip":"Amdahl and Gustafson: how much faster can a program get?"},{"label":"Flynn","tip":"SISD, SIMD, MISD, MIMD: a way to classify architectures."},{"label":"Memory systems","tip":"Shared-memory, distributed-memory and accelerated systems."},{"label":"Models","tip":"OpenMP, PThreads, MPI, CUDA, OpenCL, HIP/SYCL."}]}},{"kind":"lesson","short":"Why parallel?","slides":"Slides 3–6","title":"Why parallel? The end of Dennard scaling","concept":"Around the mid-2000s Dennard scaling ended: leakage currents and heat limits stopped clock speeds from rising, so single-thread performance plateaued. Gains now come from many cores, GPUs and clusters.","formula":{"label":"DENNARD","eq":"Smaller transistors → power density stays constant","note":"Ended mid-2000s. The heat model on the right (≈ f³) is illustrative, not on the slide."},"vocab":[["Dennard scaling","Power density constant as transistors shrink."],["Heat wall","Power and heat limit the clock frequency."],["Plateau","Single-thread speed stopped rising."],["Multicore","Many cores: today's standard architecture."]],"quiz":{"q":"Which choice gives more work for about the same heat as 1 core at 3.8 GHz?","opts":["1 core at 5 GHz","2 cores at 3 GHz","1 core at 1 GHz"],"a":1},"why":"Heat grows very fast with frequency, so one core at 5 GHz overheats (≈ 2.3× the heat). Two cores at 3 GHz give ≈ 1.6× the work for ≈ the same heat. That is why science, AI and finance now rely on parallelism.","fig":"Fig. 2 — Drag the frequency, flip to dual core, and try to hit the heat wall.","scene":{"type":"model","visual":"chip","param":{"id":"f","label":"Frequency","min":1,"max":5,"step":0.1,"value":2,"unit":"GHz"},"toggle":{"id":"n","label":"Dual core","off":1,"on":2},"outputs":[{"label":"heat","expr":"n*(f/3.8)^3","digits":2,"warnAbove":1.05},{"label":"work","expr":"n*f/3.8","digits":2}],"gauge":{"label":"Temperature","expr":"n*(f/3.8)^3","max":1.4},"threshold":{"value":4,"label":"heat wall","when":"n==1","tip":"A single core pushed this far cannot be cooled."},"messages":[{"when":"n==1 && f>=4","text":"Heat wall: this single core cannot be cooled!"},{"when":"true","text":"Reference (illustrative): 1 core at 3.8 GHz = 1.0."}]}},{"kind":"lesson","short":"Speedup & efficiency","slides":"Slides 7–8","title":"Measuring performance: speedup and efficiency","concept":"Time metrics (wall-clock, latency, throughput) and computational ones (FLOP/s, bandwidth) lead to the two key parallel metrics: speedup S = T₁/T_T and efficiency E = S/T.","formula":{"label":"METRICS","eq":"S(T) = T<sub>1</sub> / T<sub>T</sub>  ·  E(T) = S(T) / T","note":"T₁ = serial time, T_T = time with T workers. Run times on the right are illustrative."},"vocab":[["Wall-clock","Total elapsed time."],["Latency","Time per operation."],["Throughput","Operations per second."],["FLOP/s","Floating-point ops per second (Giga, Tera, Peta)."]],"quiz":{"q":"A program takes 100 s on 1 worker and 40 s on 4 workers. What is the efficiency?","opts":["100 %","62.5 %","40 %"],"a":1},"why":"Speedup = 100 / 40 = 2.5, and efficiency = 2.5 / 4 = 62.5 %. In the ideal run (25 s) speedup is 4 and efficiency 100 %. The closer to ideal, the better the workers are used.","fig":"Fig. 3 — Illustrative runs: touch each run and compare 1 worker with 4 workers.","scene":{"type":"race","a":{"label":"1 worker"},"b":{"label":"4 workers"},"unit":"s","items":[{"id":"real","label":"Real run","short":"S = 2.5×","tip":"Speedup 2.5, efficiency 62.5 %.","a":100,"b":40,"aText":"100 s","bText":"40 s"},{"id":"ideal","label":"Ideal run","short":"S = 4×","tip":"Speedup equals the number of workers: efficiency 100 %.","a":100,"b":25,"aText":"100 s","bText":"25 s"}]}},{"kind":"lesson","short":"Memory hierarchy","slides":"Slide 9","title":"Memory hierarchy: why locality matters","concept":"Access time grows from 0.3 ns (CPU register) to 50–150 µs (SSD). Reusing data in fast levels and reading nearby data together is the key to high performance.","formula":{"label":"PRINCIPLE","eq":"Fewer slow-memory accesses → higher performance","note":"Latency ranges on the slide are shown here as mid-values (L1 2, L2 6, L3 25 ns)."},"vocab":[["Temporal","Locality: reuse data already in a fast level."],["Spatial","Locality: access nearby data together."],["Cache","Small fast memory that avoids slow accesses."],["Register","Fastest storage, inside the CPU (0.3 ns)."]],"quiz":{"q":"Roughly how much slower is an SSD access than a RAM access?","opts":["About 10×","About 1 000×","About the same"],"a":1},"why":"RAM is about 100 ns and SSD about 50–150 µs: roughly a thousand times longer. Switch the towers to linear scale and the fast levels almost vanish, which is why slow accesses must be minimised.","fig":"Fig. 4 — Latency towers. Press play, touch a bar, then flip linear / log.","scene":{"type":"bars","log":true,"unitLabel":"ns","items":[{"label":"Register","x":1,"value":0.3,"valueText":"0.3 ns","tip":"CPU register access."},{"label":"L1","x":2,"value":2,"valueText":"1–3 ns","tip":"L1 cache access."},{"label":"L2","x":3,"value":6,"valueText":"3–10 ns","tip":"L2 cache access."},{"label":"L3","x":4,"value":25,"valueText":"10–40 ns","tip":"L3 cache access."},{"label":"RAM","x":5,"value":100,"valueText":"100 ns","tip":"Main memory access."},{"label":"SSD","x":6,"value":100000,"valueText":"50–150 µs","tip":"SSD storage access: about 1 000× slower than RAM."}]}},{"kind":"lesson","short":"Types of parallelism","slides":"Slide 10","title":"Four ways to be parallel","concept":"Data parallelism runs the same operation on different data; task parallelism runs different tasks at once; pipeline parallelism overlaps sequential stages; hybrids combine them.","formula":{"label":"IDEA","eq":"Split the work by data, by task or by stage","note":"Slide examples: image processing, producer–consumer, instruction pipelines, MPI + OpenMP."},"vocab":[["Data parallel","Same operation on different data."],["Task parallel","Different tasks executed concurrently."],["Pipeline","Sequential stages processed in parallel."],["Hybrid","Combined strategies, e.g. GPU + CPU."]],"quiz":{"q":"Applying the same filter to every pixel of an image is which kind of parallelism?","opts":["Data parallelism","Task parallelism","Pipeline parallelism"],"a":0},"why":"The same operation is applied to different data (each pixel), so it is data parallelism, as in the slide's image-processing example. Touch the four objects to compare the kinds.","fig":"Fig. 5 — Touch the four objects to meet each kind of parallelism.","scene":{"type":"showcase","items":[{"id":"data","model":"cube","label":"Data","sub":"same op, many data","tip":"Same operation on different data: vector operations, image processing."},{"id":"task","model":"gear","label":"Task","sub":"different tasks","tip":"Independent or loosely coupled tasks run concurrently: producer–consumer."},{"id":"pipe","model":"cylinder","label":"Pipeline","sub":"assembly line","tip":"Sequential stages processed in parallel, like an assembly line."},{"id":"hybrid","model":"chip","label":"Hybrid","sub":"MPI + OpenMP","tip":"Combine several strategies for complex applications: MPI + OpenMP, GPU + CPU."}]}},{"kind":"lesson","short":"Concurrent vs parallel","slides":"Slides 11–13","title":"Concurrency vs parallelism","concept":"Concurrency only looks simultaneous: the OS shares one processor with scheduling, time-slicing and context switching. Parallelism is truly simultaneous: several processing units work at once and must coordinate.","formula":{"label":"DISTINCTION","eq":"Concurrent = looks simultaneous · Parallel = truly simultaneous","note":"Concurrency: a juggler with many balls. Parallelism: several workers building parts at once."},"vocab":[["Time-slicing","Each task gets a short turn on the CPU."],["Context switch","Saving one task to run another (costs time)."],["Scheduler","Algorithm that shares the CPU fairly."],["Parallel","Needs several processors and coordination."]],"quiz":{"q":"A single-core CPU runs three apps that seem to work at the same time. What is this?","opts":["Concurrency","True parallelism","Pipelining"],"a":0},"why":"With one core, tasks take turns very quickly (time-slicing) and the scheduler decides who runs: an illusion of simultaneity. Shrink the time slice and watch more context switches appear in the chart.","fig":"Fig. 6 — One core, three apps. Touch the core, then change the time slice.","scene":{"type":"scheduler","tasks":["App A","App B","App C"],"quantum":{"label":"Time slice","min":0.05,"max":1.5,"value":0.6}}},{"kind":"lesson","short":"Sequential vs parallel","slides":"Slides 14–15","title":"A job run sequentially, then in parallel","concept":"Sequentially: read, preprocess, compute, postprocess, write, one step after another. In parallel, the main computation is split into chunks computed by several processors, so total time drops below the sequential time.","formula":{"label":"TIME","eq":"Parallel total time is lower than sequential time","note":"On the slide, only the main computation is marked as parallelizable."},"vocab":[["Chunk","A slice of the input given to one processor."],["Distribute","Send chunks to the available processors."],["Collect","Gather partial results from all processors."],["Sequential","One step after another on one processor."]],"quiz":{"q":"Which step of the example runs on all N processors at the same time?","opts":["Read input data","Execute main computation","Write output data"],"a":1},"why":"Each processor computes its own chunk, so the main computation is the parallel part. Splitting and combining are extra steps that the sequential version does not need.","fig":"Fig. 7 — Press play: a data chunk travels the parallel workflow. Touch each step.","scene":{"type":"flow","token":"chunk","loop":false,"steps":[{"id":"split","label":"Split","tip":"Cut the input data into chunks."},{"id":"distribute","label":"Distribute","tip":"Send chunks to processors 1 to N."},{"id":"compute","label":"Compute","tip":"Each processor computes its chunk: the parallel part."},{"id":"collect","label":"Collect","tip":"Collect results from all processors."},{"id":"combine","label":"Combine","tip":"Combine results and write the output."}]}},{"kind":"lesson","short":"Amdahl's law","slides":"Slides 16–17","title":"Amdahl's law: the sequential part sets the limit","concept":"Amdahl's law fixes the problem size. If a fraction P of the work is parallel, N processors give a speedup of 1 / (S + P/N). Even with infinite processors, the sequential part S limits the gain.","formula":{"label":"LAW","eq":"Speedup = 1 / (S + P/N),  P = 1 − S","note":"Example: 25 % sequential → 2.29× on 4 processors, 3.37× on 16, never above 4×."},"vocab":[["S","Sequential fraction of the program."],["P","Parallel fraction (1 − S)."],["N","Number of processors."],["Ceiling","Maximum speedup 1/S when N is infinite."]],"quiz":{"q":"A program is 10 % sequential. What is the maximum speedup with unlimited processors?","opts":["× 9","× 10","Unlimited"],"a":1},"why":"When N grows, P/N tends to 0 and only S remains: 1 / 0.1 = 10. Drag the slider to P = 0.90 and watch the curve flatten near 10, however many cores you add.","fig":"Fig. 8 — Speedup vs processors. Move P, then touch the curve.","scene":{"type":"plot","expr":"1/((1-p)+p/x)","x":{"label":"processors","min":1,"max":64},"y":{"label":"speedup","min":0,"max":20},"param":{"id":"p","label":"parallel part P","min":0.5,"max":0.99,"step":0.01,"value":0.75},"marks":[{"x":4,"label":"4 cores"},{"x":16,"label":"16 cores"}]}},{"kind":"lesson","short":"Gustafson vs Amdahl","slides":"Slides 18–19","title":"Gustafson's law: let the problem grow","concept":"Amdahl (fixed problem) is pessimistic: speedup is capped by 1/S. Gustafson (problem grows with the machine) is optimistic: speedup S + P×N rises almost linearly. Here S and P are measured after parallelization.","formula":{"label":"GUSTAFSON","eq":"Speedup = S + P × N","note":"Example: S = 0.10, P = 0.90 → 3.7× on 4 processors, 14.5× on 16."},"vocab":[["Fixed size","Amdahl: same problem on more cores."],["Scaled size","Gustafson: bigger problem on more cores."],["Pessimistic","Amdahl: bounded by 1/S."],["Optimistic","Gustafson: theoretically unbounded."]],"quiz":{"q":"Gustafson's law with S = 0.10 and P = 0.90 on 16 processors. What is the speedup?","opts":["× 1.6","× 14.5","× 160"],"a":1},"why":"0.10 + 0.90 × 16 = 14.5. Because the problem grows with the machine, the serial part does not cap the gain. Flip the switch: Amdahl on a fixed problem stalls below 10×.","fig":"Fig. 9 — Drag the processors, then flip between Amdahl and Gustafson.","scene":{"type":"model","visual":"dial","param":{"id":"n","label":"Processors","min":1,"max":64,"step":1,"value":16,"unit":""},"toggle":{"id":"g","label":"Gustafson","off":0,"on":1},"outputs":[{"label":"speedup","expr":"g==1 ? 0.1+0.9*n : 1/(0.1+0.9/n)","digits":2},{"label":"efficiency","expr":"(g==1 ? 0.1+0.9*n : 1/(0.1+0.9/n))/n","digits":2}],"gauge":{"label":"Speedup","expr":"g==1 ? 0.1+0.9*n : 1/(0.1+0.9/n)","max":64},"messages":[{"when":"g==1","text":"Gustafson: the problem grows, speedup keeps rising (S + P×N)."},{"when":"n>=16","text":"Amdahl: fixed problem, speedup stalls below 10×."},{"when":"true","text":"Amdahl with 10 % sequential: 1 / (0.1 + 0.9/N)."}]}},{"kind":"lesson","short":"Flynn's taxonomy","slides":"Slides 20–25, 28","title":"Flynn's taxonomy: four classes","concept":"Michael J. Flynn (1966, expanded 1972) classifies architectures by their number of instruction streams and data streams: SISD, SIMD, MISD and MIMD. MIMD is the most widely adopted paradigm today.","formula":{"label":"TAXONOMY","eq":"Instruction streams (S/M) × data streams (S/M)","note":"SISD and MISD are not a focus of the course; SIMD and MIMD are."},"vocab":[["Instr. stream","The sequence of instructions being executed."],["Data stream","The data being processed."],["SISD","One instruction, one data: sequential computer."],["MISD","Many instructions, one data: rare, theoretical."]],"quiz":{"q":"Which Flynn class describes a multi-core CPU running different threads on different data?","opts":["SISD","SIMD","MIMD"],"a":2},"why":"Several cores execute different instruction streams on different data streams: that is MIMD, the standard of modern parallel computing. Touch each floor of the stack to compare the four classes.","fig":"Fig. 10 — Four floors, one per Flynn class. Touch each floor.","scene":{"type":"stack","levels":[{"id":"sisd","title":"SISD","sub":"single · single","tip":"One instruction stream on one data stream: sequential computer, historical baseline (early PCs)."},{"id":"misd","title":"MISD","sub":"multiple · single","tip":"Several instruction streams on single data: rarely used, redundancy and fault tolerance."},{"id":"simd","title":"SIMD","sub":"single · multiple","tip":"Same instruction on many data at once: GPUs, vector units (SSE, AVX), signal processing."},{"id":"mimd","title":"MIMD","sub":"multiple · multiple","tip":"Many processors run different instructions on different data: multicore, clusters, supercomputers."}]}},{"kind":"lesson","short":"SIMD & MIMD","slides":"Slides 26–27, 29","title":"SIMD and MIMD in practice","concept":"SIMD applies one instruction to many data at once (GPUs, SSE/AVX vector units, signal processing). MIMD lets many processors run different instructions on different data: multicore CPUs, clusters, supercomputers.","formula":{"label":"SIMD","eq":"Steps = ⌈ data elements / lanes ⌉","note":"Lane counting is a standard illustration, not on the slide. Flynn's 1972 SIMD types: array, pipelined, associative."},"vocab":[["Lane","One processing unit inside a SIMD group."],["SIMT","Modern name of the array-processor type (GPUs)."],["Vectorization","Using SSE/AVX to process several values at once."],["MIMD","Independent processors, different instructions."]],"quiz":{"q":"16 numbers are processed by one SIMD instruction handling 4 at a time. How many steps?","opts":["16","4","1"],"a":1},"why":"16 elements ÷ 4 lanes = 4 steps, whereas the scalar (SISD-style) way needs 16. Flip the SIMD switch and change the number of elements to see the steps drop.","fig":"Fig. 11 — Flip the SIMD switch and change the number of data elements.","scene":{"type":"model","visual":"chip","param":{"id":"d","label":"Data elements","min":4,"max":64,"step":4,"value":16,"unit":""},"toggle":{"id":"u","label":"SIMD ×4","off":1,"on":4},"outputs":[{"label":"steps","expr":"ceil(d/u)","digits":0},{"label":"per step","expr":"u","digits":0}],"gauge":{"label":"Steps","expr":"ceil(d/u)","max":64},"messages":[{"when":"u==1","text":"One element per step (SISD style)."},{"when":"true","text":"SIMD: one instruction handles 4 elements at once."}]}},{"kind":"lesson","short":"Shared memory","slides":"Slides 30–34","title":"Shared-memory systems: SMP and NUMA","concept":"HPC relies on three families: shared-memory, distributed-memory and accelerated systems. In shared memory, tightly coupled processors share one address space and communicate through shared variables.","formula":{"label":"SHARED MEMORY","eq":"SMP: equal access · NUMA: local faster than remote","note":"Models: OpenMP (directives), PThreads (API). Challenges: false sharing, NUMA locality."},"vocab":[["SMP","Symmetric: equal access to all memory."],["NUMA","Memory split in regions; local is faster."],["OpenMP","Directive-based parallelization."],["PThreads","API for explicit thread management."]],"quiz":{"q":"In which system does every processor access all memory in the same time?","opts":["SMP","NUMA","Distributed memory"],"a":0},"why":"SMP gives equal access to a single memory space. In NUMA, memory is divided into regions attached to processors: any processor can reach all of it, but local access is faster than remote.","fig":"Fig. 12 — Touch the shared memory hub and the four CPUs that all see it.","scene":{"type":"network","hub":{"label":"Shared memory","tip":"One common address space seen by all processors."},"nodes":[{"label":"CPU 1","tip":"Runs its own thread and communicates through shared variables."},{"label":"CPU 2","tip":"Independent thread execution per processor."},{"label":"CPU 3","tip":"In NUMA, memory close to this CPU is faster than memory attached to another."},{"label":"CPU 4","tip":"Examples: multicore desktops, servers with several CPUs."}]}},{"kind":"lesson","short":"Distributed & accelerated","slides":"Slides 35–38","title":"Distributed and accelerated systems","concept":"Distributed systems have independent nodes with local memory and separate address spaces, cooperating over a network (MPI). Accelerated systems pair a CPU with specialized hardware (GPU, TPU) that has distinct memory spaces.","formula":{"label":"KEY RULE","eq":"Distributed: send messages · Accelerated: move data","note":"Examples: Fugaku and Summit supercomputers; Docker and Kubernetes for consistent deployment."},"vocab":[["MPI","Message Passing Interface: explicit communication."],["Node","Independent computer with local memory."],["Offload","Send a computation to an accelerator."],["CUDA","NVIDIA-specific GPU programming."]],"quiz":{"q":"Two cluster nodes each have their own memory. How do they exchange data?","opts":["Shared variables","Explicit network messages (MPI)","They cannot"],"a":1},"why":"Nodes have separate address spaces, so data must travel in explicit messages over the network (MPI). Data distribution and communication patterns become first-class design concerns.","fig":"Fig. 13 — Touch the four objects: clusters, cloud/grid, GPUs and TPUs.","scene":{"type":"showcase","items":[{"id":"cluster","model":"server","label":"Clusters","sub":"MPI, InfiniBand","tip":"Interconnected computers acting as one system; HPC clusters use high-speed links like InfiniBand."},{"id":"cloud","model":"sphere","label":"Cloud / Grid","sub":"AWS · WLCG","tip":"Cloud: on-demand virtual resources (AWS, Azure, Google Cloud). Grid: dispersed resources, e.g. WLCG."},{"id":"gpu","model":"chip","label":"CPU + GPU","sub":"CUDA, OpenCL","tip":"CPU handles control flow; GPU does massively parallel computation (graphics, ML/DL, simulations)."},{"id":"tpu","model":"cube","label":"TPU & DSA","sub":"ML, DSP, crypto","tip":"Google TPUs target ML workloads; domain-specific chips include DSPs, AI inference and cryptography."}]}},{"kind":"lesson","short":"Models & takeaways","slides":"Slides 39–43","title":"Choosing a programming model","concept":"The model depends on the architecture: OpenMP or PThreads for shared memory, MPI for large problems beyond one node, CUDA, OpenCL or HIP/SYCL for accelerators. MIMD dominates; SIMD is crucial for GPUs.","formula":{"label":"SUMMARY","eq":"Model choice depends on the architecture","note":"Next chapters: syntax, semantics and best practices of these models."},"vocab":[["OpenMP","Pragma hints for compilers; fork-join model."],["MPI","Industry-standard message passing."],["CUDA","NVIDIA GPU model, vendor-optimized."],["HIP/SYCL","Vendor-neutral accelerator approaches."]],"quiz":{"q":"A simulation is too large for the memory of a single node. Which model fits best?","opts":["OpenMP only","MPI (distributed memory)","PThreads"],"a":1},"why":"Distributed memory suits large-scale problems exceeding single-node capacity, and MPI is its industry standard. Shared memory is easier for fine-grained parallelism; accelerators give high performance with more complexity.","fig":"Fig. 14 — Three floors, three families of models. Touch each floor.","scene":{"type":"stack","levels":[{"id":"shared","title":"SHARED MEMORY","sub":"OpenMP · PThreads","tip":"Easier for fine-grained parallelism and tight coupling. OpenMP: pragma hints. PThreads: lower-level threads."},{"id":"distributed","title":"DISTRIBUTED","sub":"MPI","tip":"Better for large-scale problems exceeding single-node capacity; rich collective operations."},{"id":"accel","title":"ACCELERATED","sub":"CUDA · OpenCL · HIP/SYCL","tip":"High performance with complexity: careful data movement management is required."}]}}]};
